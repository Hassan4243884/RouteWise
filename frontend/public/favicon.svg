<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Background Gradient: Brand Blue to Deep Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>

    <!-- Path / Pulse Gradient -->
    <linearGradient id="routeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Weather Glow -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="7.5" fill="url(#bgGrad)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1" />

  <!-- Weather Sun Flare (Top-Right) -->
  <circle cx="23.5" cy="8.5" r="3.2" fill="url(#sunGrad)" filter="url(#shadow)" />
  <!-- Sun Rays -->
  <path d="M23.5 3.8v1.4M23.5 11.8v1.4M18.8 8.5h1.4M26.8 8.5h1.4" stroke="#FDE047" stroke-width="1" stroke-linecap="round" stroke-opacity="0.85" />

  <!-- Cloud Contour (Over Sun) -->
  <path d="M17.5 11.5a3 3 0 0 1 5.6-1.2 2.5 2.5 0 0 1 2.4 2.7c0 .1 0 .2 0 .3a2.5 2.5 0 0 1-1.5 2.2H16a2.2 2.2 0 0 1-.5-4.3c.3 0 .7.1 1 .3"
        fill="#FFFFFF" fill-opacity="0.9" />

  <!-- Dynamic S-Curve Routing Path (Bottom-Left to Center-Right) -->
  <path d="M6 25.5 C 9 25.5, 11 20, 15 19 C 19 18, 20.5 21, 25 17"
        stroke="url(#routeGrad)"
        stroke-width="2.6"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Inner Dotted Safe Guidance Line -->
  <path d="M6 25.5 C 9 25.5, 11 20, 15 19 C 19 18, 20.5 21, 25 17"
        stroke="#0284C7"
        stroke-width="0.9"
        stroke-linecap="round"
        stroke-dasharray="1.5 2" />

  <!-- Origin Waypoint Pin (Bottom-Left) -->
  <circle cx="6" cy="25.5" r="2.2" fill="#FFFFFF" />
  <circle cx="6" cy="25.5" r="1.1" fill="#0284C7" />

  <!-- Destination Waypoint Pin / Target (Center-Right) -->
  <circle cx="25" cy="17" r="2.4" fill="#10B981" filter="url(#shadow)" />
  <circle cx="25" cy="17" r="1" fill="#FFFFFF" />
</svg>
